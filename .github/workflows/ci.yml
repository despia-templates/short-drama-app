#
#  CI — the five gates, against the framework this template is actually written against.
#
#  WHY THIS NEEDS A SECRET, AND WHY THE OBVIOUS ALTERNATIVE DOES NOT WORK.
#  The first version of this workflow built against the public Apache-2.0 drop
#  (`despia-native/despia`), on the reasoning that it is what a stranger can obtain. It failed,
#  and the failure was worth having: the drop mirrors a branch BEHIND `dev`, and this template
#  is written against `dev`. Measured on the run that proved it — the drop's
#  `Documentation/reference/stack-elements.json` lists **30** universal attributes where `dev`
#  lists **38**, missing `href`, `chrome`, `shared`, `sharedMode`, `sharedAnim`, `sharedOrder`,
#  `lockOrientation` and `dismissEdge`. That census is what the linter enforces, so building
#  from the drop produced **38 hard errors** on markup that is correct and shipping
#  (PLAN.md §6.28 / §6.41). The drop also carries no `ClosedSource/`, so Stripe and SocialShare
#  cannot be configured and every `dsx.module.stripe` call warns — under `--strict`, a failure.
#
#  So: CI checks out the private framework at `dev`, which needs a read token. Add a repo
#  secret named FRAMEWORK_TOKEN (a fine-grained PAT with Contents: read on
#  despia-native/despia-framework). Without it the gates job SKIPS rather than failing — a red
#  badge for a missing credential is noise, and this template does not ship noise. The `status`
#  job below always runs and says which lane you are in.
#
name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    name: which lane
    runs-on: ubuntu-latest
    steps:
      - name: Report whether the gates can run
        run: |
          if [ -n "${{ secrets.FRAMEWORK_TOKEN }}" ]; then
            echo "FRAMEWORK_TOKEN is set — the gates job runs the full five against dev."
          else
            echo "::notice::FRAMEWORK_TOKEN is not set, so the gates job is skipped."
            echo "The DSX packages are not on npm yet and the public Apache-2.0 drop"
            echo "(despia-native/despia) mirrors a branch behind dev — measured: 30 universal"
            echo "attributes against dev's 38 — so a build from the drop fails on correct markup."
            echo "Add a fine-grained PAT with Contents: read on despia-native/despia-framework"
            echo "as the repo secret FRAMEWORK_TOKEN to turn the gates on."
          fi

  gates:
    name: lint · check:styles · review · build · verify
    if: ${{ secrets.FRAMEWORK_TOKEN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shortdrama_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DSX_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shortdrama_dev
      DSX_JWT_SECRET: ci-only-secret-not-used-anywhere-else
      DSX_INTERNAL_KEY: ci-only-internal-key
      DSX_DEV_NO_SW: "1"

    steps:
      - name: Check out the template
        uses: actions/checkout@v4
        with:
          path: short-drama-app

      # The sibling convention, exactly as scripts/preflight.mjs documents it:
      #   <parent>/despia_dsx/despia-framework/OpenSource/...
      #   <parent>/short-drama-app/
      - name: Check out the framework (dev)
        uses: actions/checkout@v4
        with:
          repository: despia-native/despia-framework
          ref: dev
          token: ${{ secrets.FRAMEWORK_TOKEN }}
          path: despia_dsx/despia-framework

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"

      - name: Build the framework's web packages
        working-directory: despia_dsx/despia-framework/OpenSource/Web
        run: |
          npm install
          npm run build
          # the CLI's exec bit does not survive every rebuild
          chmod +x packages/cli/dist/bin/*.js || true

      # ClosedSource ships in the full distribution. A checkout that has it builds the real
      # configuration; one that does not degrades in place and this script says what that costs.
      - name: Drop any module package this checkout does not carry
        working-directory: short-drama-app
        run: node scripts/ci-open-drop.mjs

      - name: Install (preflight runs first)
        working-directory: short-drama-app
        run: npm install

      - name: lint
        working-directory: short-drama-app
        run: npm run lint

      - name: check:styles
        working-directory: short-drama-app
        run: npm run check:styles

      - name: review
        working-directory: short-drama-app
        run: npm run review

      - name: build
        working-directory: short-drama-app
        run: npm run build

      - name: Apply the migration and the policy addendum
        working-directory: short-drama-app
        run: |
          psql "$DSX_DATABASE_URL" -v ON_ERROR_STOP=1 -f server/generated/migration.sql
          psql "$DSX_DATABASE_URL" -v ON_ERROR_STOP=1 -f server/policies.local.sql

      - name: Mint the local session and seed the catalogue
        working-directory: short-drama-app
        run: |
          npm run session
          npm run serve &
          npx --yes wait-on http://localhost:8787/catalog/home --timeout 60000
          npm run seed

      - name: verify (boots its own origin and asserts behaviour)
        working-directory: short-drama-app
        run: npm run verify
