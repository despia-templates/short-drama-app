<svg xmlns="http://www.w3.org/2000/svg" width="176" height="176" viewBox="0 0 176 176">
  <!-- the Watch Mission hourglass — a generated asset, never an emoji (AGENTS.md). Authored at
       176px = 44pt @4x so the 28pt ring badge and the 44pt sheet glyph both downsample crisp.
       Teal sand on a warm frame: the reference paints a gold-framed glass with teal sand, the
       app's accent (#4ADFB4) and its gold (#F5C518) — both named tones in Theme.dsx. -->
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F5C518"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EE7C5"/>
      <stop offset="1" stop-color="#4ADFB4"/>
    </linearGradient>
  </defs>
  <!-- caps -->
  <rect x="34" y="14" width="108" height="16" rx="8" fill="url(#frame)"/>
  <rect x="34" y="146" width="108" height="16" rx="8" fill="url(#frame)"/>
  <!-- glass body -->
  <path d="M50 30 H126 C126 62 98 74 92 88 C98 102 126 114 126 146 H50 C50 114 78 102 84 88 C78 74 50 62 50 30 Z"
        fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3" stroke-linejoin="round"/>
  <!-- top sand (draining) -->
  <path d="M62 54 H114 C110 66 98 74 92 86 L84 86 C78 74 66 66 62 54 Z" fill="url(#sand)"/>
  <!-- the falling grain -->
  <rect x="86" y="86" width="4" height="34" rx="2" fill="#4ADFB4"/>
  <!-- bottom sand (mound) -->
  <path d="M58 146 H118 C116 132 104 120 88 116 C72 120 60 132 58 146 Z" fill="url(#sand)"/>
  <!-- glass highlight -->
  <path d="M60 38 C60 56 76 68 82 78" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="3" stroke-linecap="round"/>
</svg>
